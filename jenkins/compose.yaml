# Local Jenkins for the case study:  docker compose -f jenkins/compose.yaml up -d --build
# Open http://localhost:9090
# SECURITY NOTE: mounting docker.sock gives Jenkins full control of the host Docker. Fine for a personal lab machine, not for production.
name: queueless-jenkins
services:
  jenkins:
    build: .
    container_name: queueless-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home:
