spring.application.name=queueless
server.port=${PORT:8081}

# --- Database -------------------------------------------------------------
# Default = local H2 file database (no install needed). Docker/Kubernetes override DB_URL with MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/queueless-dev;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
# Schema initialisation: Hibernate creates/updates tables on startup (see README "Database").
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Health endpoints (used by Docker and Kubernetes probes) ----------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db

# --- QueueLess settings -------------------------------------------------------
queueless.jwt.secret=${JWT_SECRET:}
queueless.jwt.expiry-minutes=120
queueless.timezone=${APP_TIMEZONE:Asia/Kolkata}
queueless.default-service-minutes=5
queueless.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
queueless.admin.email=${ADMIN_EMAIL:admin@queueless.local}
queueless.admin.password=${ADMIN_PASSWORD:}
queueless.seed.sample-services=true
