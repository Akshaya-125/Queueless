apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: queueless
spec:
  replicas: 1                 # scale to 2+ AFTER the first pod is Ready (first start creates the tables), see README
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
        - name: backend
          image: queueless-backend:1.0
          imagePullPolicy: IfNotPresent     # image is built locally, not pulled from a registry
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: queueless-config
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: queueless-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: queueless-secrets, key: JWT_SECRET } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: queueless-secrets, key: ADMIN_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: queueless
spec:
  selector:
    app: backend
  ports:
    - port: 8081
      targetPort: 8081
