<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · QueueLess</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="nav" class="nav"></header>
<main id="main" class="container">
  <h1 id="dashboard-title">Dashboard</h1>
  <p class="muted" id="welcome"></p>
  <div class="section-head"><h2>My active tokens</h2></div>
  <div id="active-tokens"><div class="loading"><span class="spinner"></span>Loading…</div></div>
  <div class="section-head"><h2>Available services</h2><button class="btn btn-ghost btn-sm" id="refresh-btn" type="button">Refresh</button></div>
  <div id="services" class="grid grid-3"><div class="loading"><span class="spinner"></span>Loading…</div></div>
  <div class="section-head"><h2>Token history</h2></div>
  <div class="table-wrap"><table aria-label="Token history">
    <thead><tr><th>Token</th><th>Service</th><th>Date</th><th>Status</th><th>Booked at</th><th></th></tr></thead>
    <tbody id="history"><tr><td colspan="6" class="loading">Loading…</td></tr></tbody>
  </table></div>
</main>
<footer class="footer">QueueLess · Smart Queue and Token Management · College DevOps case study</footer>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
