<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a token · QueueLess</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="nav" class="nav"></header>
<main id="main" class="container narrow">
  <h1>Book a token</h1>
  <p class="muted">Choose a service to get your place in the queue.</p>
  <div class="card">
    <div id="form-error" class="alert alert-error" role="alert" hidden></div>
    <div class="field"><label for="service-select">Service</label>
      <select id="service-select" data-testid="service-select"><option value="">Loading services…</option></select></div>
    <div id="service-info" class="alert alert-info" hidden></div>
    <button class="btn" id="book-btn" type="button" data-testid="book-btn" style="width:100%" disabled>Get my token</button>
  </div>
  <div id="token-result" class="card" hidden aria-live="polite">
    <h2>Your token is ready</h2>
    <div class="token-big"><div class="svc" id="result-service"></div><div class="number" id="result-number" data-testid="result-number"></div></div>
    <div class="kv"><div><div class="k">Queue position</div><div class="v" id="result-position"></div></div>
      <div><div class="k">Estimated wait (approximate)</div><div class="v" id="result-eta"></div></div></div>
    <p style="margin-top:1rem"><a class="btn" id="result-track" data-testid="track-link" href="track.html">Track this token</a></p>
  </div>
</main>
<footer class="footer">QueueLess · Smart Queue and Token Management · College DevOps case study</footer>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/book.js"></script>
</body>
</html>
