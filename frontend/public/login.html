<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · QueueLess</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="nav" class="nav"></header>
<main id="main" class="container narrow">
  <h1>Welcome back</h1>
  <p class="muted">New here? <a href="register.html">Create an account</a></p>
  <form id="login-form" class="card" novalidate>
    <div id="session-note" class="alert alert-info" hidden>Your session expired. Please log in again.</div>
    <div id="form-error" class="alert alert-error" role="alert" hidden></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="err-email"><div id="err-email" class="field-error"></div></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="err-password"><div id="err-password" class="field-error"></div></div>
    <button class="btn" id="login-btn" type="submit" style="width:100%">Log in</button>
  </form>
</main>
<footer class="footer">QueueLess · Smart Queue and Token Management · College DevOps case study</footer>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
